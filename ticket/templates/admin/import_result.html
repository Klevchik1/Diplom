{% extends "admin/base_site.html" %}

{% block content %}
<div style="padding: 20px;">
    <h1>{{ title }}</h1>
    
    <div style="background: #f8f9fa; padding: 20px; margin-bottom: 20px; border-radius: 5px;">
        <pre style="background: #2b2b2b; color: #a9b7c6; padding: 15px; border-radius: 4px; overflow-x: auto;">
{{ output }}
        </pre>

    <div style="margin-top: 20px;">
        <a href="{% url 'admin:ticket_movie_changelist' %}" style="background: #417690; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">

        <a href="{% url 'admin:movie-import-from-api' %}" style="margin-left: 10px; color: #666;">
